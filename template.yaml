AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Finance management backend — cost-optimized for single-digit user counts.
  FastAPI packaged as a Lambda container image, fronted by an API Gateway
  HTTP API (v2) with a Cognito JWT authorizer.

  Unlike the production-grade version, this stack owns its full database
  footprint as code: an Aurora Serverless v2 cluster (scale-to-zero) with an
  RDS-managed Secrets Manager credential. The Lambda function runs outside
  any VPC, and the database is publicly reachable behind TLS + a generated
  password — trading network-layer isolation for eliminating the NAT
  Gateway's flat monthly fee entirely. See README.md for the cost/security
  tradeoff writeup before reusing this pattern for anything beyond a
  personal, low-traffic project.

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, staging, prod]
    Description: Deployment environment. Also used as the API Gateway stage name.

  CognitoUserPoolId:
    Type: String
    Description: Cognito User Pool ID used to build the JWT issuer URL, e.g. ap-northeast-1_XXXXXXXXX.

  CognitoUserPoolClientId:
    Type: String
    Description: Cognito App Client ID. Validated as the JWT audience.

  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: >
      VPC to place the Aurora cluster's subnet group in. The Lambda function
      itself does NOT join this VPC — only the database needs it, and RDS
      always requires a subnet group even for a publicly accessible instance.
      The account's default VPC works fine here.

  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: >
      At least two public subnets (in different AZs) for the DB subnet group,
      e.g. the default VPC's default subnets. Get them with:
      aws ec2 describe-subnets --filters Name=vpc-id,Values=<VpcId> Name=default-for-az,Values=true --query "Subnets[].SubnetId"

  DbName:
    Type: String
    Default: financedb
    AllowedPattern: "^[a-zA-Z][a-zA-Z0-9_]*$"

  DbMaxCapacityAcu:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 8
    Description: >
      Ceiling on Aurora Serverless v2 capacity units (0.5 ACU increments,
      ~$0.12/ACU-hour). MinCapacity is fixed at 0 below so the cluster scales
      to zero and stops billing compute during idle periods. Keep this low —
      single-digit users don't need headroom above 1 ACU (~2 GB RAM).

  CorsAllowOrigins:
    Type: CommaDelimitedList
    Default: "*"
    Description: Origins allowed by the HTTP API CORS configuration. Set to the frontend origin in prod.

  LambdaMemorySize:
    Type: Number
    Default: 512
    MinValue: 128
    MaxValue: 10240

  LambdaTimeout:
    Type: Number
    Default: 30
    MinValue: 3
    MaxValue: 900
    Description: >
      Keep at or below the API Gateway HTTP API integration limit of 30s.
      Note: a cold Aurora resume from zero can take 15-30s by itself, so a
      request that also cold-starts the Lambda may need most of this budget.

  LogRetentionInDays:
    Type: Number
    Default: 14
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 180, 365]

Conditions:
  IsProd: !Equals [!Ref Environment, prod]

Globals:
  Function:
    Timeout: !Ref LambdaTimeout
    MemorySize: !Ref LambdaMemorySize
    Architectures: [x86_64]
    Tracing: Active
    Environment:
      Variables:
        ENVIRONMENT: !Ref Environment
        DB_SECRET_ARN: !GetAtt AuroraCluster.MasterUserSecret.SecretArn
        DB_HOST: !GetAtt AuroraCluster.Endpoint.Address
        DB_PORT: !GetAtt AuroraCluster.Endpoint.Port
        DB_NAME: !Ref DbName
        COGNITO_USER_POOL_ID: !Ref CognitoUserPoolId
        # Mangum strips this prefix from incoming paths so FastAPI routes
        # match without every route carrying the stage name.
        API_STAGE: !Ref Environment

Resources:
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub Public subnets for ${AWS::StackName} Aurora cluster
      SubnetIds: !Ref PublicSubnetIds

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub Allow Postgres to ${AWS::StackName} Aurora cluster
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        # The Lambda function runs outside a VPC and has no stable source IP,
        # so this can't be scoped tighter without reintroducing a NAT Gateway
        # or a VPC-attached Lambda. Exposure is mitigated by TLS-only
        # connections (rds.force_ssl) and an RDS-managed, non-reused password.
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: 0.0.0.0/0
          Description: Postgres from anywhere (auth + TLS enforced at the DB)

  DbParameterGroup:
    Type: AWS::RDS::DBClusterParameterGroup
    Properties:
      Description: Force TLS on all connections
      Family: aurora-postgresql17
      Parameters:
        rds.force_ssl: "1"

  AuroraCluster:
    Type: AWS::RDS::DBCluster
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Engine: aurora-postgresql
      # Scale-to-zero requires a recent Aurora PostgreSQL minor version.
      # Verify this still meets the current minimum in AWS's docs before
      # deploying — the requirement has moved as the feature has matured.
      EngineVersion: "17.7"
      DatabaseName: !Ref DbName
      MasterUsername: postgres
      ManageMasterUserPassword: true
      DBSubnetGroupName: !Ref DbSubnetGroup
      DBClusterParameterGroupName: !Ref DbParameterGroup
      VpcSecurityGroupIds:
        - !GetAtt DbSecurityGroup.GroupId
      ServerlessV2ScalingConfiguration:
        MinCapacity: 0
        MaxCapacity: !Ref DbMaxCapacityAcu
      StorageEncrypted: true
      BackupRetentionPeriod: 1
      DeletionProtection: false
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: finance-mgmt-backend-lite

  AuroraInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      Engine: aurora-postgresql
      DBInstanceClass: db.serverless
      DBClusterIdentifier: !Ref AuroraCluster
      DBSubnetGroupName: !Ref DbSubnetGroup
      PubliclyAccessible: true
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: finance-mgmt-backend-lite

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Environment
      Auth:
        DefaultAuthorizer: CognitoJwtAuthorizer
        Authorizers:
          CognitoJwtAuthorizer:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPoolId}
              audience:
                - !Ref CognitoUserPoolClientId
      CorsConfiguration:
        AllowOrigins: !Ref CorsAllowOrigins
        AllowHeaders: [Authorization, Content-Type]
        AllowMethods: [GET, POST, PUT, DELETE, OPTIONS]
        MaxAge: 600
      AccessLogSettings:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: >-
          {"requestId":"$context.requestId","ip":"$context.identity.sourceIp","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","routeKey":"$context.routeKey","path":"$context.path","status":"$context.status","protocol":"$context.protocol","responseLength":"$context.responseLength","integrationLatency":"$context.integrationLatency","userSub":"$context.authorizer.claims.sub"}
      Tags:
        Environment: !Ref Environment
        Application: finance-mgmt-backend-lite

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-api
      Description: FastAPI application served through Mangum.
      PackageType: Image
      ImageConfig:
        # Mirrors the Dockerfile CMD; kept here so the entrypoint is visible
        # in the stack rather than only baked into the image.
        Command: ["src.main.handler"]
      # Deliberately not VPC-attached: no VPC means no NAT Gateway / VPC
      # endpoint is needed to reach Secrets Manager or ECR, which is the
      # single biggest fixed cost this fork removes. The tradeoff is that
      # the Aurora cluster above must be publicly reachable instead.
      Policies:
        - AWSSecretsManagerGetSecretValuePolicy:
            SecretArn: !GetAtt AuroraCluster.MasterUserSecret.SecretArn
      Events:
        # Public — used by uptime checks and to warm the function. Path
        # matches the app's route (APIRouter prefix "/api").
        HealthCheck:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /api/health
            Method: GET
            Auth:
              Authorizer: NONE
        # Explicit methods rather than ANY: leaving OPTIONS unrouted lets the
        # HTTP API answer CORS preflight itself, unauthenticated. An ANY route
        # would instead hand preflight to the Cognito authorizer, which 401s
        # it (no Authorization header on a preflight) and breaks browser CORS.
        RootGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /
            Method: GET
        ProxyGet:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: GET
        ProxyPost:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: POST
        ProxyPut:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: PUT
        ProxyDelete:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: DELETE
        ProxyPatch:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: PATCH
      Tags:
        Environment: !Ref Environment
        Application: finance-mgmt-backend-lite
    Metadata:
      DockerContext: .
      Dockerfile: Dockerfile
      DockerTag: latest

  # Declared explicitly so retention is managed by the stack. Lambda would
  # otherwise create this group on first invocation with no expiry.
  ApiFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-api
      RetentionInDays: !Ref LogRetentionInDays

  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      LogGroupName: !Sub /aws/apigateway/${AWS::StackName}
      RetentionInDays: !Ref LogRetentionInDays

  ApiErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: IsProd
    Properties:
      AlarmName: !Sub ${AWS::StackName}-function-errors
      AlarmDescription: Lambda function errors in the finance backend.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref ApiFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  ApiEndpoint:
    Description: Base URL of the HTTP API, including the stage path.
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${Environment}
    Export:
      Name: !Sub ${AWS::StackName}-ApiEndpoint

  ApiId:
    Description: HTTP API ID.
    Value: !Ref HttpApi

  FunctionName:
    Description: Lambda function name, for `aws lambda update-function-code`.
    Value: !Ref ApiFunction
    Export:
      Name: !Sub ${AWS::StackName}-FunctionName

  FunctionArn:
    Description: Lambda function ARN.
    Value: !GetAtt ApiFunction.Arn

  FunctionRoleArn:
    Description: Execution role ARN, for granting further AWS access.
    Value: !GetAtt ApiFunctionRole.Arn

  LogGroupName:
    Description: CloudWatch log group for the function.
    Value: !Ref ApiFunctionLogGroup

  AuroraClusterEndpoint:
    Description: Aurora cluster write endpoint.
    Value: !GetAtt AuroraCluster.Endpoint.Address

  DbSecretArn:
    Description: ARN of the RDS-managed Secrets Manager credential (username + password only).
    Value: !GetAtt AuroraCluster.MasterUserSecret.SecretArn
